name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      APP_NAME: CVD Backend
      APP_ENV: test
      APP_DEBUG: "false"
      APP_HOST: 127.0.0.1
      APP_PORT: "8000"
      DATABASE_URL: sqlite+pysqlite:////tmp/cvd-backend.sqlite3
      FILE_STORAGE_ROOT: /tmp/cvd-backend-storage
      JWT_SECRET_KEY: test-secret-key
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    steps:
      - uses: actions/checkout@v7

      - name: Reject local tooling artifacts
        run: |
          forbidden="$(git ls-files | grep -E '^(\.agents/|\.claude/(launch\.json|skills/)|\.codex/|\.impeccable/|\.opencode/|\.superpowers/|skills-lock\.json$|[^/]+\.xlsx$)' || true)"
          test -z "$forbidden" || { echo "$forbidden"; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          save-cache: false

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Pytest
        working-directory: backend
        run: uv run pytest

  postgres-smoke:
    name: PostgreSQL smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cvd_test
          POSTGRES_USER: cvd
          POSTGRES_PASSWORD: cvd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvd -d cvd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_NAME: CVD Backend
      APP_ENV: test
      APP_DEBUG: "false"
      APP_HOST: 127.0.0.1
      APP_PORT: "8000"
      DATABASE_URL: postgresql+psycopg://cvd:cvd@127.0.0.1:5432/cvd_test
      FILE_STORAGE_ROOT: /tmp/cvd-postgres-storage
      JWT_SECRET_KEY: test-secret-key
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run PostgreSQL smoke paths
        working-directory: backend
        run: |
          uv run pytest \
            tests/api/test_v2_full_walkthrough.py \
            tests/api/test_files.py::test_upload_file_creates_metadata_and_supports_download \
            tests/models/test_postgres_features.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: frontend-next
        run: bun install --frozen-lockfile

      - name: Prettier
        working-directory: frontend-next
        run: bun run check

      - name: Regenerate field metadata (生成器⑤)
        working-directory: frontend-next
        run: bun run gen:fields

      - name: Check field metadata drift
        run: |
          git diff --exit-code -- frontend-next/src/shared/generated
          test -z "$(git status --porcelain -- frontend-next/src/shared/generated)"

      - name: Typecheck
        working-directory: frontend-next
        run: bun run typecheck

      - name: ESLint
        working-directory: frontend-next
        run: bun run lint

      - name: Vitest
        working-directory: frontend-next
        run: bun run test

  field-source:
    name: Field source (v2 单一源)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          save-cache: false

      - name: Install dependencies
        run: uv sync --project backend --frozen

      - name: Check field-source consistency (YAML ↔ xlsx 逐格一致)
        run: uv run --project backend python docs/standard/check_field_source.py

  generated-artifacts:
    name: Generated artifacts
    runs-on: ubuntu-latest
    env:
      APP_NAME: CVD Backend
      APP_ENV: test
      APP_DEBUG: "false"
      APP_HOST: 127.0.0.1
      APP_PORT: "8000"
      DATABASE_URL: sqlite+pysqlite:////tmp/cvd-generated.sqlite3
      FILE_STORAGE_ROOT: /tmp/cvd-generated-storage
      JWT_SECRET_KEY: test-secret-key
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          save-cache: false

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Regenerate committed v2 schema artifacts
        working-directory: backend
        run: uv run python -m app.commands.export_v2_schema

      - name: Check generated artifact drift
        run: |
          git diff --exit-code -- docs/standard/generated
          test -z "$(git status --porcelain -- docs/standard/generated)"
