      input: 附件+自由
      options: —
      unit: —
      requirement:
        raw: 推荐
        level: recommended
      example: setup.png + 卧式双温区
      source: 会议
      note: ''
    - module: 设备
      label: 炉管使用履历
      label_en: Tube usage history
      key: tube_usage_history
      meaning: 当前炉管的累计清洗或更换次数，以及本次实验是最近一次清洗或更换后的第几次使用
      input: 使用履历对象
      options: '{reset_count, use_number_since_reset}'
      unit: 次
      requirement:
        raw: 必填
        level: required
      example: '{reset_count: 1, use_number_since_reset: 7}'
      source: 6/24决定·用户复核2026-07-24
      note: 每炉手填；清洗或更换炉管后累计次数加1，本次使用序号从1重新累计
  - title: §3 前驱体装载（独立放置或涂覆在具体衬底片上，可多组）
    fields:
    - module: 前驱体
      label: 装载标识
      label_en: Source load key
      key: load_key
      meaning: 每组前驱体装载在本炉内稳定且唯一的机器标识
      input: 系统生成
      options: load_*
      unit: —
      requirement:
        raw: 必填（系统生成）
        level: required
      example: load_1
