      label_en: Tube dimensions
      key: tube_outer_diameter_wall_mm
      meaning: 按截面形状记录外部尺寸和壁厚
      input: 炉管尺寸对象
      options: '{圆形: outer_diameter_mm+wall_thickness_mm; 方形: outer_side_mm+wall_thickness_mm; 矩形: outer_width_mm+outer_height_mm+wall_thickness_mm; 其他: dimension_description}'
      unit: mm
      requirement:
        raw: 选择炉管材质与截面后必填
