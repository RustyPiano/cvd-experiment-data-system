      input: 多选
      options: 无/等离子体/光/电
      unit: —
      requirement:
        raw: 选填
        level: optional
      example: 无
      source: 2026-07-24导师走查
      note: 只读投影；不得当成本炉实际使用记录
    - module: 设备
      label: 装置示意图与描述
      label_en: Setup diagram and description
      key: setup_diagram
