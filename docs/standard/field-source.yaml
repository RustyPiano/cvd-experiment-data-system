      r0: true
    - module: 前驱体
      label: CAS号（来自批次）
      label_en: CAS number (from lot)
      key: cas_inchi
      meaning: 从所选物料批次快照带出的 CAS 号
      input: 文本
      options: CAS
      unit: —
