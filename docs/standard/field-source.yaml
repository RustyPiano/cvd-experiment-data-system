      status: pending-alignment
      pending: 待明确清单#5：词表粒度（7项多选 vs 生长/不生长），导师K75点名
    - module: 实测产物
      label: 检出相、多型与堆垛
      label_en: Detected phase, polytype, and stacking
      key: detected_phase_stacking
