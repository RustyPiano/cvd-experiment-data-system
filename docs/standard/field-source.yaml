      input: 固定定义
      options: 上游为负；下游为正；原点固定
      unit: —
      requirement:
        raw: 定义项
        level: definition
      example: 上游(-)←原点→下游(+)
      source: 复审
      note: ★v3：从逐次填『原点+轴向』改为全局定死，防选反
