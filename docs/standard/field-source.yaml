      key: layer_count
      meaning: 由表征方法判定的层数
      input: 数值
      options: —
      unit: 层
      validation:
        type: integer
        ge: 0
      requirement:
        raw: 选填
        level: optional
      example: '1'
      source: 复审/科学契约审查
      note: 与覆盖率拆分，0 表示在该测点未检出层状产物
    - module: 实测产物
      label: 覆盖率
      label_en: Coverage
      key: coverage_percent
      meaning: 明确视场或统计区域内材料面积占比
      input: 数值
      options: —
      unit: '%'
      validation:
        ge: 0
        le: 100
      requirement:
        raw: 选填
        level: optional
      example: '70'
      source: 复审/科学契约审查
      note: 量化口径仍须随表征条件记录
      status: pending-alignment
      pending: 待明确清单#6：SEM覆盖率组里叫法/量化方式待确认
    - module: 实测产物
      label: 畴尺寸
      label_en: Domain size
      key: domain_size_um
      meaning: 由指定统计方法得到的代表性畴尺寸
      input: 数值
      options: —
      unit: μm
      validation:
        gt: 0
      requirement:
        raw: 选填
        level: optional
      example: '50'
      source: 复审/科学契约审查
      note: ''
    - module: 实测产物
      label: 成核密度
      label_en: Nucleation density
      key: nucleation_density_cm2
      meaning: 指定统计区域内单位面积成核点数量
      input: 数值
      options: —
      unit: cm⁻²
      validation:
        ge: 0
      requirement:
        raw: 选填
        level: optional
      example: '10000'
      source: 复审/科学契约审查
      note: ''
    - module: 实测产物
      label: 关键谱学指标
      label_en: Key spectroscopic metrics
      key: key_spectral_metrics
      meaning: Raman峰位/峰宽/峰面积；PL峰位/峰宽；AFM厚度/粗糙度；SEM覆盖率(视场内材料面积占比,%)/尺寸
      input: 结构化指标数组
      options: 每条:{metric_code,value,unit}
      unit: 按指标
      validation:
        item_required:
        - metric_code
        - value
        - unit
        finite_value: true
      requirement:
        raw: 选填
        level: optional
      example: '[{"metric_code":"raman_e2g_peak","value":384.2,"unit":"cm-1"}]'
      source: 复审/导师
      note: ★v3.4导师评审(C79红字/K79)：PL补峰宽；『SEM占比』改名『SEM覆盖率』并给定义；随技术选填
  - title: §8 PVD 专用（若合成方法选 PVD 类才启用；延后实现，先占位）
