      key: process_role_other
      meaning: 选择其他工艺作用时填写的具体名称
      input: 文本
      options: —
      unit: —
      requirement:
        raw: 条件必填(工艺作用包含其他)
        level: conditional_required
        condition:
          field: 前驱体.工艺作用
          op: eq
          value: 其他
      example: 晶面选择剂
      source: 2026-08-12师兄试填复核
      note: 仅在工艺作用包含其他时显示
    - module: 前驱体
      label: 使用量
      label_en: Amount used
      key: amount
