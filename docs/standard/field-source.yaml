# ============================================================================
# CVD-2D 元数据标准 v2.0 —— 字段【单一权威源】(实现方案 D1)
# 改字段只改这里；生成: python3 docs/standard/build_field_tables.py
# 校验: python3 docs/standard/check_field_source.py（CI 强制）
# ============================================================================
meta:
  name: CVD-2D 工艺数据标准 · 字段单一源
  version: v3.5
  status: DRAFT
  updated: '2026-07-22'
  authority: 本文件是全部字段/词表/必填规则的唯一权威源（实现方案 D1）；xlsx 及后续 Pydantic/JSON Schema/种子/前端元数据均由本文件生成，禁止手改生成物。
  edit_howto: 改字段=改本文件 → python3 docs/standard/build_field_tables.py 重新生成 xlsx → python3 docs/standard/check_field_source.py 校验。
  keys_convention: 字段 key = API/payload 契约（D10）：snake_case；全词优于缩写（保留行业标准缩写 CAS/PID/MFC/CoA/D50）；单位后缀沿 v1 风格（_C/_mm/_nm/_um/_min/_percent/_per_m3/_sccm/_nm_s）；冻结后改 key 视同改字段，须走变更流程；v1→v2 对应关系统一在 P5 mapping，不靠同名。
  i18n: 国际化（D12）：字段 label/placeholder/help 与可选词表均提供中英文展示；受控词表提交和存储稳定 ASCII 机器码，中文与英文仅用于显示；自由文本允许任意语言；xlsx 人读视图保持中文。
