        condition:
          field: MaterialLot.批次类别
          op: eq
          value: 衬底
      example: SiO₂/Si
      source: review
      note: 与§4衬底材料词表一致
    - module: MaterialLot
      label: ▸衬底·云母类型
      label_en: Substrate · mica type
      key: mica_type
      meaning: 云母衬底的矿物类型；用于生成对应的理想化学式
      input: 下拉
      options: 白云母·金云母·氟金云母
      unit: —
      requirement:
        raw: 条件必填(云母)
        level: conditional_required
        condition:
          field: MaterialLot.▸衬底·材料
          op: eq
          value: 云母
      example: 氟金云母
      source: 2026-09-01用户试填反馈
      note: 选择后系统生成理想化学式；具体成分仍以包装标签、规格书或CoA为准
    - module: MaterialLot
      label: ▸衬底·氧化层厚度
      label_en: Substrate · oxide thickness
      key: substrate_oxide_thickness_nm
      meaning: 仅SiO₂/Si
      input: 数值
      options: —
      unit: nm
      validation:
        gt: 0
      requirement:
        raw: 条件必填(SiO₂/Si)
        level: conditional_required
        condition:
          field: MaterialLot.▸衬底·材料
          op: eq
          value: SiO₂/Si
      example: '285'
      source: review
      note: ''
    - module: MaterialLot
      label: ▸衬底·晶向与抛光信息
      label_en: Substrate · orientation and polish availability
      key: substrate_orientation_polish_availability
      meaning: 供应商是否提供且该衬底是否适用晶面取向与抛光规格
