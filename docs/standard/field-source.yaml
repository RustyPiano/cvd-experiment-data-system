          value: 衬底
      example: 有规格数值
      source: 2026-07-25用户复核
      note: Cu/Au箔等不适用时明确选择不适用；禁止伪填晶向或抛光面
      help: 单晶片且供应商给了晶面和抛光规格时选“有规格数值”；未给或不适用请明确选择。
      help_en: Choose “Specification reported” only when orientation and polish are supplied; otherwise select not provided or not applicable.
    - module: MaterialLot
      label: ▸衬底·晶向与抛光
      label_en: Substrate · orientation and polish
      key: substrate_orientation_polish
      meaning: 取向与抛光面
      input: 文本+下拉
      options: 晶向；单面抛/双面抛
      unit: —
      validation:
        require_value: true
        require_option: true
      requirement:
        raw: 条件必填(有规格数值)
        level: conditional_required
        condition:
          field: MaterialLot.▸衬底·晶向与抛光信息
          op: eq
          value: 有规格数值
      example: Si(100)；单面抛
      source: review
      note: 实验引用批次后只读带出
      help: 例：c 面；单面抛。晶面和抛光面都写清楚。
      help_en: 'Example: c-plane; single-side polished. State both orientation and polished side.'
    - module: MaterialLot
      label: ▸衬底·偏切信息
      label_en: Substrate · miscut availability
      key: substrate_miscut_availability
      meaning: 供应商是否提供且该衬底是否适用相对标称晶面的偏切规格
      input: 下拉
      options: 有规格数值·供应商未提供·不适用
      unit: —
      requirement:
        raw: 条件必填(衬底)
        level: conditional_required
        condition:
          field: MaterialLot.批次类别
          op: eq
          value: 衬底
      example: 供应商未提供
      source: 2026-07-25用户复核
      note: 0仅表示供应商明确报告无偏切，不能表示未知或不适用
      help: 有偏切规格才选“有规格数值”；供应商没给或该材料不适用时请选择对应状态。
      help_en: Choose “Specification reported” only when a miscut specification exists; zero never represents unknown.
    - module: MaterialLot
      label: ▸衬底·偏切角
      label_en: Substrate · miscut angle
      key: substrate_miscut_angle_deg
      meaning: 实际晶面相对标称晶面的偏切角
      input: 数值
      options: —
      unit: °
      validation:
        ge: 0
        lt: 90
      requirement:
        raw: 条件必填(有规格数值)
        level: conditional_required
        condition:
          field: MaterialLot.▸衬底·偏切信息
          op: eq
          value: 有规格数值
      example: '0.2'
      source: 2026-07-24用户走查
      note: 大于0时必须同时填写substrate_miscut_direction
      help: 无偏切填 0；有偏切时还要填写偏向哪个晶轴或方向。
      help_en: Enter 0 for no miscut; otherwise also state the crystallographic direction.
    - module: MaterialLot
      label: ▸衬底·偏切方向
      label_en: Substrate · miscut direction
      key: substrate_miscut_direction
      meaning: 偏切角所指的晶轴或晶向
      input: 文本
      options: —
      unit: —
      requirement:
        raw: 条件必填(偏切角>0)
        level: optional
        condition:
          field: MaterialLot.▸衬底·偏切信息
          op: eq
          value: 有规格数值
      example: c面向a轴
      source: 2026-07-24用户走查
      note: substrate_miscut_angle_deg大于0时由跨字段校验强制填写
      help: 例：c 面向 a 轴；角度填在上一项。
      help_en: 'Example: c-plane toward the a-axis; enter the angle above.'
    - module: MaterialLot
      label: ▸衬底·标称表面粗糙度
      label_en: Substrate · nominal surface roughness
      key: substrate_surface_roughness
      meaning: 供应商或批次规格中的标称粗糙度
      input: 粗糙度对象
      options: '{availability: 有规格数值|供应商未提供；有规格数值时 metric: Ra|RMS, value_nm}'
      unit: nm
      requirement:
        raw: 条件必填(衬底)
        level: conditional_required
        condition:
          field: MaterialLot.批次类别
          op: eq
          value: 衬底
      example: '{availability: not_provided}'
      source: 2026-07-25用户复核
      note: reported时metric与value_nm必填；not_provided时二者禁止填写；历史无availability对象按reported兼容；本片AFM实测值属于表征结果
      help: 有供应商或批次规格就选“有规格数值”并填 Ra/RMS；没有就明确选“供应商未提供”，不要填 0 或猜测值。
      help_en: Enter a reported supplier or lot Ra/RMS value, or explicitly choose “Supplier did not provide”; never use zero as an unknown value.
    - module: MaterialLot
      label: ▸衬底·来料尺寸规格
      label_en: Substrate · supplied-lot size
      key: substrate_size_spec
      meaning: 供应商标称或该批次来料的原始几何；切割后本次实际单片尺寸属于实验记录
      input: 文本
      options: 长×宽×厚
      unit: mm
      requirement:
        raw: 选填
        level: optional
        condition:
          field: MaterialLot.批次类别
          op: eq
          value: 衬底
      example: 10×10×0.5
      source: review
      note: 不替代每次实验的本片实际尺寸
      help: 填供应商标签或该批次来料的标称尺寸；切割后放进炉内的实际尺寸在每次实验中填写。
      help_en: Enter the supplier-labelled or incoming lot size; record the actual cut piece loaded into each run in the experiment.
    - module: MaterialLot
      label: ▸气瓶·纯度等级
      label_en: Gas cylinder · purity grade
      key: gas_purity_grade
      meaning: 子类(批次类别=气瓶)；与base『纯度』分工
      input: 下拉
      options: 6N/5N/4N/工业级
      unit: —
      requirement:
        raw: 选填
        level: optional
        condition:
          field: MaterialLot.批次类别
          op: eq
          value: 气瓶
      example: 5N
      source: review
      note: base纯度的数值百分比为权威值；这里只保留供应商标签
      help: 有供应商等级标签可填；数值纯度以“纯度（质量%）”为准。
      help_en: Enter the supplier grade if present; the numeric purity percentage is authoritative.
    - module: MaterialLot
      label: ▸气瓶·气瓶编号
      label_en: Gas cylinder · cylinder number
      key: gas_cylinder_number
      meaning: 钢瓶追溯号
      input: 文本
      options: —
      unit: —
      requirement:
        raw: 选填
        level: optional
        condition:
          field: MaterialLot.批次类别
          op: eq
          value: 气瓶
      example: GC-Ar-07
      source: review
      note: ''
