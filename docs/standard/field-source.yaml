      example: 助熔或盐辅助·促进反应或成核
      source: 2026-08-12师兄试填复核
      note: 可多选或留空；不再要求选择金属源、硫族元素源或掺杂源等与成分交叉的单一分类
    - module: 前驱体
      label: 其他工艺作用
