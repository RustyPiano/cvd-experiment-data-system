      meaning: 在反应里的角色
      input: 下拉
      options: 主源/辅助剂/掺杂源/其他
      unit: —
      requirement:
        raw: 选填
        level: optional
      example: 主源
      source: 建议
      note: 界面中文(英文)
    - module: 前驱体
      label: 用量
      label_en: Amount loaded
      key: amount
      meaning: 投料量（只记投料，不记残余）
      input: 数值
      ui:
        visibility_gated: true
      options: —
      unit: mg 或 µL（按相态）
      validation:
        gt: 0
      requirement:
        raw: 条件必填(非气态)
        level: conditional_required
        condition:
          field: 前驱体.相态
          op: ne
          value: 气
      example: '20'
      source: 会议/复审
      note: ★相态≠气时必填；固态mg、液态µL/质量（Fable三轮B3）
      r0: true
    - module: 前驱体
