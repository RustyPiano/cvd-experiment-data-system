      label_en: Pre-loading treatment
      key: treatment_steps
      meaning: 投料前处理（可多步，选了再展开参数）
      input: 前驱体处理步骤数组
      options: '{type: 直接加载|熔融凝固|压片|旋涂|退火|研磨|其他, other_name?, parameters: 具名参数对象}'
      unit: —
      requirement:
        raw: 推荐
        level: recommended
      example: '[{type: 旋涂, parameters: {speed_rpm: 3000, duration_s: 60}}]'
      source: 2026-07-24导师走查
      note: 有序可重复；已知方式使用具名参数和固定单位；压片及其他使用至少一项{name,value,unit}，不接受无单位自由文本
    - module: 前驱体
