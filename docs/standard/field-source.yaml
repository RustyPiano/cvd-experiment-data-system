      example: '{outer_width_mm: 50, outer_height_mm: 30, wall_thickness_mm: 2}'
      source: 会议·用户复核2026-07-24
      note: 选择材质与截面后必须按形状完整填写；圆形填外径+壁厚，方形填外边长+壁厚，矩形填外宽+外高+壁厚，其他截面填写具名尺寸说明
    - module: 设备
      label: 坐标系
