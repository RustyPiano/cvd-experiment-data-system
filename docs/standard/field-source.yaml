# ============================================================================
# CVD-2D 元数据标准 —— 字段与科学对象【单一权威源】(实现方案 D1)
# 改字段只改这里；生成: uv run --project backend python docs/standard/build_field_tables.py
# 校验: uv run --project backend python docs/standard/check_field_source.py（CI 强制）
# ============================================================================
meta:
  name: CVD-2D 工艺数据标准 · 字段单一源
  version: v4.0-alpha.21
  status: INTERNAL_VALIDATION
  updated: '2026-09-01'
  authority: 本文件是全部字段/词表/必填规则的唯一权威源（实现方案 D1）；xlsx 及后续 Pydantic/JSON Schema/种子/前端元数据均由本文件生成，禁止手改生成物。
  edit_howto: 改字段=改本文件 → uv run --project backend python docs/standard/build_field_tables.py 重新生成 xlsx → uv run --project backend python docs/standard/check_field_source.py 校验。
  keys_convention: 字段 key = API/payload 契约（D10）：snake_case；全词优于缩写（保留行业标准缩写 CAS/PID/MFC/CoA）；单位后缀沿既有风格（_C/_mm/_nm/_um/_min/_percent/_per_m3/_sccm/_nm_s）；冻结后改 key 视同改字段，须走版本治理；本项目不执行 v1→v2 数据迁移。
  i18n: 国际化（D12）：字段 label/placeholder/help 与可选词表均提供中英文展示；受控词表提交和存储稳定 ASCII 机器码，中文与英文仅用于显示；自由文本允许任意语言；xlsx 人读视图保持中文。
scientific_contract:
  lifecycle: draft → release_candidate → released → deprecated
  released_method: CVD
  excluded_profiles:
  - PVD
  run_revision:
    immutable: true
    correction: new revision with supersedes_revision_id and correction_reason
    sample_provenance: append-only SampleRevisionAssociation snapshot per locked revision
    contributors:
    - performed_by
    - recorded_by
    - reviewed_by
  ambient_measurements:
    fields:
    - value
    - measured_at
    - source_type
    - sensor_ref
    source_types:
    - room_sensor
    - setup_sensor
    - manual_entry
    - manual_estimate
    - not_measured
    not_measured: store an explicit source_type without value, time, or sensor
    sensor_ref_required_for:
    - room_sensor
    - setup_sensor
  target_spec:
    architecture_types:
    - single_region
    - vertical_stack
    - lateral_junction
    - mixed_architecture
    composition_relations:
    - doped_by
    - substitutional_alloy
    - solid_solution_component
    - intercalated_by
    - decorated_by
  source_load:
    identity: physical loading instance
    ingredients: one or more MaterialLot version references
    ingredient_process_roles:
    - reaction_or_nucleation_promoter
    - flux_or_salt_assistant
    - transport_agent
    - solvent_or_dispersion_medium
    - reducing_agent
    - oxidizing_agent
    - etchant
    - other
    concentration_units:
    - mol_per_L
    - mmol_per_L
    - g_per_L
    - mg_per_mL
    - wt_percent
    - vol_percent
    - other
    ingredient_concentration:
      applicable_when: preparation_steps contains spin_coat
      optional_pair: [concentration_value, concentration_unit]
      other_name_pair: [concentration_unit, concentration_unit_other]
    preparation_step_types:
    - direct_load
    - grind
    - mix
    - pelletize
    - spin_coat
    - pre_anneal
    - other
    preparation_step_parameters:
      direct_load: {}
      grind:
        duration_min: {type: number, required: false, unit: min, gt: 0}
      mix:
        items: {type: named_parameter_list, required: false}
      pelletize:
        pressure_MPa: {type: number, required: true, unit: MPa, gt: 0}
        duration_s: {type: number, required: false, unit: s, gt: 0}
        die_diameter_mm: {type: number, required: false, unit: mm, gt: 0}
      spin_coat:
        stages:
          type: ordered_list
          required: true
          min_items: 1
          item:
            speed_rpm: {type: number, required: true, unit: rpm, gt: 0}
            duration_s: {type: number, required: true, unit: s, gt: 0}
      pre_anneal:
        temperature_C: {type: number, required: true, unit: °C, gt: -273.15}
        duration_min: {type: number, required: true, unit: min, gt: 0}
        atmosphere:
          type: controlled_or_other
          required: false
          options: [air, vacuum, gas_species, other]
          other_name_key: atmosphere_other
      other:
        other_name: {type: text, required: true}
        items: {type: named_parameter_list, required: true}
    parameter_template_status: internal_validation; pelletize and other minimum templates remain pending real-run trial confirmation
    owns:
    - container_instance
    - container_snapshot_at_lock
    - preparation_steps
    - position_program
    - heating_zone_ref
    - substrate_source_ids
  process_timeline:
    time_origin: basic_info.started_at
    entry_model:
      phase_order: [system_preparation, temperature_program, gas_program, cooling]
      user_enters: actual_operations_and_durations
      system_derives: channel_absolute_times
      manual_absolute_time: custom_gas_interval_only
    segment_types:
      canonical: []
      legacy_read_only: [system_preparation, pre_reaction, reaction, post_reaction, cooling, other, purge, ramp, nucleation, growth, anneal, transfer]
    preparation_operations:
      optional: true
      types: [pump_down, gas_exchange, leak_check, other]
      required_fields: [operation_type, duration_min]
      conditional_fields:
        gas_exchange: [gas_sources, cycle_count]
        other: [other_name]
      gas_source_identity: frozen MaterialLot gas-cylinder version; one premixed cylinder is one source, while on-site mixing references each physical cylinder
    temperature_program:
      entry: initial_setpoint_then_step_duration_and_target_setpoint
      per_zone: true
      absolute_times: derived
    gas_timing_presets:
    - whole_process
    - custom
    channel_identity: channel_type + subject_instance_ref + source_type
    timeseries_file:
      required_columns: [time_s, value]
      parser_version: process_timeseries_csv_v1
      frozen_projection: [source_file_sha256, min, max, mean, median, time_weighted_mean, ramp_rate_per_min, cooling_rate_per_min, valid_duration_s, excluded_duration_s, sampling_interval_s]
    channels:
    - temperature
    - flow
    - pressure
    - valve_state
    - source_position
    - furnace_position
    - plasma_power
    - shutter_state
  process_event:
    observed_deviations:
    - line_blockage
    - pressure_excursion
    - signal_anomaly
    - manual_intervention
    - equipment_alarm
    - manual_stop
    - power_interruption
    - water_interruption
    - gas_interruption
    - plan_changed
    intervention_actions:
    - adjust_flow
    - adjust_pressure
    - adjust_temperature
    - restart_supply
    - inspect_equipment
    - stop_run
    - other
    affected_objects:
    - source_load
    - gas_line
    - furnace
    - substrate
    - sample
    - process_channel
    - instrument
    - other
    suspected_causes:
    - line_blockage
    - equipment_fault
    - utility_interruption
    - operator_action
    - process_instability
    - unknown
    - other
  result_chain: Sample → MeasurementRun (instrument + calibration-at-measurement snapshot) → AnalysisRun → PropertyValue / MaterialAssertion
  sample_actual_states:
  - unknown
  - growth_present
  - no_growth
  - uncertain
  property_units:
    afm_ra_roughness: nm
    raman_e2g_peak_position: cm⁻¹
    raman_a1g_peak_position: cm⁻¹
    raman_peak_separation: cm⁻¹
    raman_peak_fwhm: cm⁻¹
    raman_intensity_ratio: ratio
    shear_mode_peak_position: cm⁻¹
    low_frequency_peak_fwhm: cm⁻¹
    pl_a_exciton_peak_energy: eV
    pl_b_exciton_peak_energy: eV
    pl_integrated_intensity: a.u.
    pl_peak_fwhm: meV
    afm_step_height: nm
    afm_rms_roughness: nm
    coverage_percent: '%'
    domain_size_um: μm
    nucleation_density_cm2: cm⁻²
    xrd_peak_2theta: ° 2θ
    xrd_peak_fwhm: ° 2θ
    xrd_d_spacing: nm
    tem_lattice_spacing: nm
    observation_note: —
gas_species:
  Ar:
    label_zh: 氩气
    label_en: Argon
    aliases: [Ar, AR, argon, 氩气]
  N2:
    label_zh: 氮气
    label_en: Nitrogen
    aliases: [N2, n2, nitrogen, 氮气]
  H2:
    label_zh: 氢气
    label_en: Hydrogen
    aliases: [H2, h2, hydrogen, 氢气]
  O2:
    label_zh: 氧气
    label_en: Oxygen
    aliases: [O2, o2, oxygen, 氧气]
  He:
    label_zh: 氦气
    label_en: Helium
    aliases: [He, HE, helium, 氦气]
  CH4:
    label_zh: 甲烷
    label_en: Methane
    aliases: [CH4, ch4, methane, 甲烷]
  H2S:
    label_zh: 硫化氢
    label_en: Hydrogen sulfide
    aliases: [H2S, h2s, hydrogen sulfide, 硫化氢]
  NH3:
    label_zh: 氨气
    label_en: Ammonia
    aliases: [NH3, nh3, ammonia, 氨气]
  CO2:
    label_zh: 二氧化碳
    label_en: Carbon dioxide
    aliases: [CO2, co2, CO₂, carbon dioxide, 二氧化碳]
characterization_properties:
  coverage_percent:
    label_zh: 覆盖率
    label_en: Coverage
    value_type: numeric
    validation: {ge: 0, le: 100}
  domain_size_um:
    label_zh: 晶畴尺寸
    label_en: Domain size
    value_type: numeric
    validation: {gt: 0}
  nucleation_density_cm2:
    label_zh: 成核密度
    label_en: Nucleation density
    value_type: numeric
    validation: {ge: 0}
  raman_e2g_peak_position:
    label_zh: Raman E₂g 峰位
    label_en: Raman E2g peak position
    value_type: numeric
    validation: {ge: 0}
  raman_a1g_peak_position:
    label_zh: Raman A₁g 峰位
    label_en: Raman A1g peak position
    value_type: numeric
    validation: {ge: 0}
  raman_peak_separation:
    label_zh: Raman 峰间距
    label_en: Raman peak separation
    value_type: numeric
    validation: {ge: 0}
  raman_peak_fwhm:
    label_zh: Raman 峰宽
    label_en: Raman peak FWHM
    value_type: numeric
    validation: {gt: 0}
  raman_intensity_ratio:
    label_zh: Raman 强度比
    label_en: Raman intensity ratio
    value_type: numeric
    validation: {ge: 0}
  shear_mode_peak_position:
    label_zh: 剪切模峰位
    label_en: Shear-mode peak position
    value_type: numeric
    validation: {ge: 0}
  low_frequency_peak_fwhm:
    label_zh: 低频 Raman 峰宽
    label_en: Low-frequency Raman peak FWHM
    value_type: numeric
    validation: {gt: 0}
  pl_a_exciton_peak_energy:
    label_zh: PL A 激子峰能量
    label_en: PL A-exciton peak energy
    value_type: numeric
    validation: {gt: 0}
  pl_b_exciton_peak_energy:
    label_zh: PL B 激子峰能量
    label_en: PL B-exciton peak energy
    value_type: numeric
    validation: {gt: 0}
  pl_integrated_intensity:
    label_zh: PL 积分强度
    label_en: PL integrated intensity
    value_type: numeric
    validation: {ge: 0}
  pl_peak_fwhm:
    label_zh: PL 峰宽
    label_en: PL peak FWHM
    value_type: numeric
    validation: {gt: 0}
  afm_ra_roughness:
    label_zh: AFM 算术平均粗糙度
    label_en: AFM arithmetic roughness
    value_type: numeric
    validation: {ge: 0}
  afm_rms_roughness:
    label_zh: AFM 均方根粗糙度
    label_en: AFM RMS roughness
    value_type: numeric
    validation: {ge: 0}
  afm_step_height:
    label_zh: AFM 台阶高度
    label_en: AFM step height
    value_type: numeric
    validation: {ge: 0}
  xrd_peak_2theta:
    label_zh: XRD 衍射峰位
    label_en: XRD peak 2-theta
    value_type: numeric
    validation: {ge: 0, le: 180}
  xrd_peak_fwhm:
    label_zh: XRD 衍射峰宽
    label_en: XRD peak FWHM
    value_type: numeric
    validation: {gt: 0}
  xrd_d_spacing:
    label_zh: XRD 晶面间距
    label_en: XRD d-spacing
    value_type: numeric
    validation: {gt: 0}
  tem_lattice_spacing:
    label_zh: TEM 晶格间距
    label_en: TEM lattice spacing
    value_type: numeric
    validation: {gt: 0}
  observation_note:
    label_zh: 观察说明
    label_en: Observation note
    value_type: text
    validation: {min_length: 1, max_length: 2000}
characterization_profiles:
  optical_microscopy:
    label_zh: 光学显微镜
    label_en: Optical microscopy
    instrument_required: false
    raw_files_required: false
    show_growth_presence: true
    raw_file_guidance_zh: 建议上传原始图像；仅记录直接观察结论时可不上传。
    allowed_region_types: [point, area, whole_sample, selected_area]
    required_condition_keys: []
    optional_condition_keys: [objective, illumination_mode]
    condition_fields:
    - {key: objective, label_zh: 物镜, label_en: Objective, value_type: text, validation: {max_length: 128}}
    - {key: illumination_mode, label_zh: 照明模式, label_en: Illumination mode, value_type: text, validation: {max_length: 128}}
    allowed_property_codes: [coverage_percent, domain_size_um, nucleation_density_cm2, observation_note]
    default_property_codes: [coverage_percent]
    allowed_assertion_types: [growth_presence, phase_identity, composition, polytype, stacking_order, orientation_relationship, layer_count]
  Raman:
    label_zh: Raman
    label_en: Raman spectroscopy
    instrument_required: true
    raw_files_required: true
    show_growth_presence: false
    raw_file_guidance_zh: 请上传原始光谱或仪器导出文件。
    allowed_region_types: [point, line, whole_sample, selected_area]
    required_condition_keys: [laser_wavelength_nm]
    optional_condition_keys: [power_setting, objective, integration_time_s, accumulations]
    condition_fields:
    - {key: laser_wavelength_nm, label_zh: 激光波长, label_en: Laser wavelength, value_type: number, unit: nm}
    - {key: power_setting, label_zh: 功率设置, label_en: Power setting, value_type: text, validation: {max_length: 128}}
    - {key: objective, label_zh: 物镜, label_en: Objective, value_type: text, validation: {max_length: 128}}
    - {key: integration_time_s, label_zh: 积分时间, label_en: Integration time, value_type: number, unit: s}
    - {key: accumulations, label_zh: 累加次数, label_en: Accumulations, value_type: integer}
    allowed_property_codes: [raman_e2g_peak_position, raman_a1g_peak_position, raman_peak_separation, raman_peak_fwhm, raman_intensity_ratio]
    default_property_codes: [raman_e2g_peak_position, raman_a1g_peak_position, raman_peak_separation]
    allowed_assertion_types: [phase_identity, polytype, stacking_order, layer_count]
  low_frequency_raman:
    label_zh: 低频 Raman
    label_en: Low-frequency Raman spectroscopy
    instrument_required: true
    raw_files_required: true
    show_growth_presence: false
    raw_file_guidance_zh: 请上传原始光谱或仪器导出文件。
    allowed_region_types: [point, line, whole_sample, selected_area]
    required_condition_keys: [laser_wavelength_nm]
    optional_condition_keys: [power_setting, objective, integration_time_s, accumulations]
    condition_fields:
    - {key: laser_wavelength_nm, label_zh: 激光波长, label_en: Laser wavelength, value_type: number, unit: nm}
    - {key: power_setting, label_zh: 功率设置, label_en: Power setting, value_type: text, validation: {max_length: 128}}
    - {key: objective, label_zh: 物镜, label_en: Objective, value_type: text, validation: {max_length: 128}}
    - {key: integration_time_s, label_zh: 积分时间, label_en: Integration time, value_type: number, unit: s}
    - {key: accumulations, label_zh: 累加次数, label_en: Accumulations, value_type: integer}
    allowed_property_codes: [shear_mode_peak_position, low_frequency_peak_fwhm]
    default_property_codes: [shear_mode_peak_position]
    allowed_assertion_types: [polytype, stacking_order, layer_count]
  PL:
    label_zh: PL
    label_en: Photoluminescence
    instrument_required: true
    raw_files_required: true
    show_growth_presence: false
    raw_file_guidance_zh: 请上传原始光谱。
    allowed_region_types: [point, line, whole_sample, selected_area]
    required_condition_keys: [excitation_wavelength_nm]
    optional_condition_keys: [power_setting, integration_time_s, spectral_range_nm, temperature_K]
    condition_fields:
    - {key: excitation_wavelength_nm, label_zh: 激发波长, label_en: Excitation wavelength, value_type: number, unit: nm}
    - {key: power_setting, label_zh: 功率设置, label_en: Power setting, value_type: text, validation: {max_length: 128}}
    - {key: integration_time_s, label_zh: 积分时间, label_en: Integration time, value_type: number, unit: s}
    - key: spectral_range_nm
      label_zh: 光谱范围
      label_en: Spectral range
      value_type: range
      unit: nm
      components: [{key: min, label_zh: 最小值, label_en: Minimum}, {key: max, label_zh: 最大值, label_en: Maximum}]
    - {key: temperature_K, label_zh: 测量温度, label_en: Measurement temperature, value_type: number, unit: K}
    allowed_property_codes: [pl_a_exciton_peak_energy, pl_b_exciton_peak_energy, pl_integrated_intensity, pl_peak_fwhm]
    default_property_codes: [pl_a_exciton_peak_energy, pl_b_exciton_peak_energy]
    allowed_assertion_types: [phase_identity, layer_count]
  AFM:
    label_zh: AFM
    label_en: Atomic force microscopy
    instrument_required: true
    raw_files_required: true
    show_growth_presence: false
    raw_file_guidance_zh: 请上传原始高度数据及导出图。
    allowed_region_types: [point, area, whole_sample, selected_area]
    required_condition_keys: [scan_size_um]
    optional_condition_keys: [mode, probe, resolution_px, scan_rate_hz]
    condition_fields:
    - {key: mode, label_zh: 模式, label_en: Mode, value_type: text, validation: {max_length: 128}}
    - {key: probe, label_zh: 探针, label_en: Probe, value_type: text, validation: {max_length: 128}}
    - key: scan_size_um
      label_zh: 扫描尺寸
      label_en: Scan size
      value_type: size
      unit: μm
      components: [{key: x, label_zh: X, label_en: X}, {key: y, label_zh: Y, label_en: Y}]
    - key: resolution_px
      label_zh: 分辨率
      label_en: Resolution
      value_type: resolution
      unit: px
      components: [{key: width, label_zh: 宽, label_en: Width}, {key: height, label_zh: 高, label_en: Height}]
    - {key: scan_rate_hz, label_zh: 扫描速率, label_en: Scan rate, value_type: number, unit: Hz}
    allowed_property_codes: [afm_ra_roughness, afm_rms_roughness, afm_step_height]
    default_property_codes: [afm_rms_roughness, afm_step_height]
    allowed_assertion_types: [layer_count]
  SEM:
    label_zh: SEM
    label_en: Scanning electron microscopy
    instrument_required: true
    raw_files_required: true
    show_growth_presence: true
    raw_file_guidance_zh: 请上传原始图像与仪器元数据。
    allowed_region_types: [point, area, whole_sample, selected_area]
    required_condition_keys: [accelerating_voltage_kV]
    optional_condition_keys: [working_distance_mm, detector, field_of_view_um]
    condition_fields:
    - {key: accelerating_voltage_kV, label_zh: 加速电压, label_en: Accelerating voltage, value_type: number, unit: kV}
    - {key: working_distance_mm, label_zh: 工作距离, label_en: Working distance, value_type: number, unit: mm}
    - {key: detector, label_zh: 探测器, label_en: Detector, value_type: text, validation: {max_length: 128}}
    - key: field_of_view_um
      label_zh: 视场
      label_en: Field of view
      value_type: size
      unit: μm
      components: [{key: width, label_zh: 宽, label_en: Width}, {key: height, label_zh: 高, label_en: Height}]
    allowed_property_codes: [coverage_percent, domain_size_um, nucleation_density_cm2]
    default_property_codes: [coverage_percent, domain_size_um]
    allowed_assertion_types: [growth_presence, composition]
  XRD:
    label_zh: XRD
    label_en: X-ray diffraction
    instrument_required: true
    raw_files_required: true
    show_growth_presence: false
    raw_file_guidance_zh: 请上传原始衍射数据。
    allowed_region_types: [whole_sample, area, selected_area]
    required_condition_keys: [radiation_source, scan_range_2theta_deg]
    optional_condition_keys: [step_size_deg, scan_rate_deg_min, geometry]
    condition_fields:
    - {key: radiation_source, label_zh: 辐射源, label_en: Radiation source, value_type: text, validation: {max_length: 128}}
    - key: scan_range_2theta_deg
      label_zh: 2θ 扫描范围
      label_en: 2-theta scan range
      value_type: range
      unit: °
      components: [{key: start, label_zh: 起点, label_en: Start}, {key: end, label_zh: 终点, label_en: End}]
    - {key: step_size_deg, label_zh: 步长, label_en: Step size, value_type: number, unit: °}
    - {key: scan_rate_deg_min, label_zh: 扫描速率, label_en: Scan rate, value_type: number, unit: °/min}
    - {key: geometry, label_zh: 几何构型, label_en: Geometry, value_type: text, validation: {max_length: 128}}
    allowed_property_codes: [xrd_peak_2theta, xrd_peak_fwhm, xrd_d_spacing]
    default_property_codes: [xrd_peak_2theta, xrd_d_spacing]
    allowed_assertion_types: [phase_identity, polytype, stacking_order, orientation_relationship]
  TEM:
    label_zh: TEM
    label_en: Transmission electron microscopy
    instrument_required: true
    raw_files_required: true
    show_growth_presence: false
    raw_file_guidance_zh: 请上传原始图像、衍射或 EDS 数据。
    allowed_region_types: [lamella, particle, whole_sample, selected_area]
    required_condition_keys: [accelerating_voltage_kV]
    optional_condition_keys: [mode, sample_preparation]
    condition_fields:
    - {key: accelerating_voltage_kV, label_zh: 加速电压, label_en: Accelerating voltage, value_type: number, unit: kV}
    - {key: mode, label_zh: 模式, label_en: Mode, value_type: text, validation: {max_length: 128}}
