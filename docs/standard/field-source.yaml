entities:
  headers:
  - 实体
  - 字段
  - 含义/为什么记
  - 填写方式
  - 可选项/格式
  - 单位
  - 必填(登记)
  - 填写示例
  - 来源
  - 备注
  - 机器约束
  sections:
  - title: ※ 本表定义『实验只引用、不重复录入』的一等实体；『必填(登记)』指登记该实体时必填，与实验记录的 R0 不同。实验引用时对当时版本快照冻结。
    fields: []
  - title: 实体① 物料批次库 MaterialLot（统一维护前驱体、衬底与气瓶批次；实验中只引用批次并冻结所引用版本）
    fields:
    - module: MaterialLot
      label: 批次类别
      label_en: Lot category
      key: lot_category
      meaning: 决定启用哪组子类字段
      input: 下拉
      options: 化学品/衬底/气瓶
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 化学品
      source: 复审
      note: 驱动子类条件字段
    - module: MaterialLot
      label: 版本号
      label_en: Version number
      key: version
      meaning: 每次修改+1；实验引用时冻结此版本
      input: 数值
      options: —
      unit: —
      requirement:
        raw: 定义项（实体版本外层元数据）
        level: none
      example: '1'
      source: ★锁版使能(Fable三轮B2)
      note: 改则新版本，旧引用不受影响
    - module: MaterialLot
      label: 物料名称
      label_en: Material name
      key: substance_name
      meaning: 物料标签或CoA上的名称，允许中文或英文；与化学式、CAS号分别记录
      input: 文本
      options: —
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 三氧化钼
      source: review§4.1A
      note: 按标签记录，不要求用户自行翻译；不用化学式代替名称；已知类型的衬底由系统根据“衬底材料”生成
      placeholder: 按包装标签原文填写
      placeholder_en: Enter the name shown on the package label
    - module: MaterialLot
      label: 化学式
      label_en: Chemical formula
      key: chemical_formula
      meaning: 化学身份：分子式
      input: 物料化学式
      options: 支持括号、化学计量数与水合点
      unit: —
      requirement:
        raw: 条件必填(非气瓶)
        level: conditional_required
        condition:
          field: MaterialLot.批次类别
          op: ne
          value: 气瓶
      example: MoO3
      source: 2026-08-06用户界面复核
      note: 复用目标产物的化学式输入与即时校验；已知类型的衬底由系统生成生长表面化学式，仅云母或其他衬底需人工填写；气瓶改为记录结构化气体组成，不伪造混合物单一化学式
      placeholder: 例如 MoO3
      placeholder_en: e.g. MoO3
    - module: MaterialLot
      label: CAS 号
      label_en: CAS number
      key: cas_number
      meaning: 标签或CoA明确提供时抄录的CAS登记号
      input: 文本
      options: CAS
      unit: —
      requirement:
        raw: 选填
        level: optional
        condition:
          field: MaterialLot.批次类别
          op: eq
          value: 化学品
      example: 1313-27-5
      source: 2026-08-02供应商标签/CoA公开资料复核
      note: 自研、复配或供应商资料未提供时留空
      placeholder: 例如 1313-27-5
      placeholder_en: e.g. 1313-27-5
    - module: MaterialLot
      label: 供应商
      label_en: Supplier
      key: supplier
      meaning: 商业批次：厂商
      input: 下拉+其他(可扩展)
      options: 受控+其他
      unit: —
      requirement:
        raw: 推荐
        level: recommended
      example: 阿拉丁
      source: 2026-08-06用户界面复核
      note: 历史供应商可复用；新增时按包装标签原文填写名称
    - module: MaterialLot
      label: 货号（Cat. No. / Product No.）
      label_en: Catalog number (Cat. No. / Product No.)
      key: catalog_number
      meaning: 供应商用于识别产品与规格的编号
      input: 文本
      options: —
      unit: —
      requirement:
        raw: 选填
        level: optional
      example: M112056
      source: 2026-08-06用户界面复核
      note: 同一货号可对应多个批号
      placeholder: 例如 M112056
      placeholder_en: e.g. M112056
      help: 用于识别产品和规格；按包装标签、产品页或 CoA 原文填写。同一货号可对应多个批号。
      help_en: Identifies the product and specification. Copy it from the package label, product page, or CoA; one catalog number may have multiple lot numbers.
    - module: MaterialLot
      label: 产品等级（标签原文）
      label_en: Product grade (as labeled)
      key: declared_grade
      meaning: 包装标签、产品页或CoA给出的产品等级原文
      input: 文本
      options: —
      unit: —
      requirement:
        raw: 选填
        level: optional
        condition:
          field: MaterialLot.批次类别
          op: ne
          value: 衬底
      example: 99.98% trace metals basis
      source: 2026-08-02供应商标签/CoA公开资料复核
      note: 按供应商资料原文记录；未提供时留空
      placeholder: 例如 ACS reagent、分析纯、电子级或 5.0
      placeholder_en: e.g. ACS reagent, analytical grade, electronic grade, or 5.0
      help: 照录包装标签、产品页或 CoA 上的等级名称；未标注时留空。
      help_en: Copy the grade shown on the package label, product page, or CoA; leave blank if none is stated.
    - module: MaterialLot
      label: 批号（Lot No. / Batch No.）
      label_en: Lot/Batch number
      key: batch_number
      meaning: 识别当前这批实物的批次编号
      input: 文本
      options: —
      unit: —
      requirement:
        raw: 必填
        level: required
      example: B202405
      source: 2026-08-06用户界面复核
      note: 同一货号下用于区分不同生产批次
      placeholder: 例如 B202405
      placeholder_en: e.g. B202405
      help: 用于识别当前这批实物；填写包装标签或 CoA 中 Lot/Batch 后的编号。
      help_en: Identifies this physical lot. Enter the number shown after Lot or Batch on the package label or CoA.
    - module: MaterialLot
      label: 纯度
      label_en: Purity
      key: purity
      meaning: 标签或CoA明确给出的数值纯度百分比
      input: 数值
      options: 百分数
      unit: '%'
      validation:
        gt: 0
        le: 100
      requirement:
        raw: 选填
        level: optional
        condition:
          field: MaterialLot.批次类别
          op: eq
          value: 化学品
      example: '99.995'
      source: 2026-08-02供应商标签/CoA公开资料复核
      note: 未明确标示百分数时留空；等级原文记录于“产品等级（标签原文）”，原始依据由标签或CoA附件保留
      placeholder: 例如 99.995
      placeholder_en: e.g. 99.995
      help: 仅填写标签或 CoA 明确标示的百分数；等级或 N 值不作换算。
      help_en: Enter only an explicitly stated percentage from the label or CoA; do not convert grades or N-values.
    - module: MaterialLot
      label: 物料形态
      label_en: Material form
      key: form_appearance
      meaning: 试剂外观
      input: 下拉+其他
      options: 粉末/颗粒/块/液体/箔/靶/其他
      unit: —
      requirement:
        raw: 选填
        level: optional
        condition:
          field: MaterialLot.批次类别
          op: eq
          value: 化学品
      example: 粉末
      source: review
      note: 外观=性状；气瓶不使用粉末/箔/靶等物料形态
    - module: MaterialLot
      label: 开封日期
      label_en: Date opened
      key: opened_date
      meaning: 影响吸潮/氧化
      input: 日期
      options: —
      unit: —
      requirement:
        raw: 选填
        level: optional
        condition:
          field: MaterialLot.批次类别
          op: ne
          value: 衬底
      example: '2026-05-01'
      source: review
      note: ''
      placeholder: YYYY-MM-DD
      placeholder_en: YYYY-MM-DD
    - module: MaterialLot
      label: 存储方式
      label_en: Storage method
      key: storage_method
      meaning: 存放条件
      input: 下拉+其他
      options: 干燥器/手套箱/常温避光/冷藏/其他
      unit: —
      requirement:
        raw: 选填
        level: optional
        condition:
          field: MaterialLot.批次类别
          op: ne
          value: 衬底
      example: 干燥器
      source: review
      note: desiccator=干燥器
    - module: MaterialLot
      label: 分析证书（CoA）
      label_en: Certificate of Analysis (CoA)
      key: coa_attachment
      meaning: 质检证书
      input: FileAsset引用
      options: '{file_asset_id, sha256}'
      unit: —
      requirement:
        raw: 选填
        level: optional
        condition:
          field: MaterialLot.批次类别
          op: ne
          value: 衬底
      example: coa.pdf
      source: review
      note: ''
    - module: MaterialLot
      label: 包装标签附件
      label_en: Package label attachment
      key: label_attachment
      meaning: 试剂瓶身、气瓶或衬底包装标签的原始照片，用于追溯批号与规格
      input: FileAsset引用
      options: '{file_asset_id, sha256}'
      unit: —
      requirement:
        raw: 推荐
        level: recommended
        condition:
          field: MaterialLot.批次类别
          op: ne
          value: 衬底
      example: bottle-label.jpg
      source: 2026-07-24导师走查
      note: 与CoA分开；同一物料版本至少上传一次并可预览、下载
    - module: MaterialLot
      label: ▸衬底·材料
      label_en: Substrate · material
      key: substrate_material
      meaning: 子类(批次类别=衬底)
      input: 下拉+其他
      options: SiO₂/Si·蓝宝石(Al₂O₃)·石英·云母·Cu箔·Au箔·h-BN·其他
      unit: —
      requirement:
        raw: 条件必填(衬底)
