      source: 6/24决定·用户复核2026-07-24
      note: 每炉手填；清洗或更换炉管后重置次数加1，本次使用序号从1重新累计
      help: 填本次实验对应的当前计数；从未重置可填“0、当前使用序号”。
      help_en: Enter the counts for this run. If the tube has never been reset, use reset count 0 and the current use number.
  - title: §3 前驱体（用了哪些原料：主源、辅助剂等，可多个；每个一组）
    fields:
    - module: 前驱体
      label: 前驱体标识（来自批次）
      label_en: Precursor identity (from lot)
      key: name_formula
