stage_types:
  note: §5 动态表单的权威映射：仅保留预处理、反应条件和具名其他记录。Pydantic 判别联合与前端显隐均从这里生成，未知阶段必须拒绝，禁止静默丢弃。
  groups:
    common: 所有记录共用（记录类型）
    preparation: 预处理操作（抽气、气路置换）
    reaction: 反应条件（温度、实测温度、逐气体供气、压力、时长、降温）
    external_field: 装置具备对应能力时才显示的本炉实际外场
    other: 具名其他记录
  types:
  - name: 预处理
    shows:
    - preparation
    required_extra:
    - preparation_operations
  - name: 反应条件
    shows:
    - reaction
    - external_field
    required_extra:
    - temperature_program
    - gas_feeds
    - pressure_system
    - duration_cycles
  - name: 其他记录
    shows:
    - other
    required_extra:
    - other_stage_name
    - notes
experiment_record:
  headers:
  - 模块
  - 字段
  - 含义/为什么记
  - 填写方式
  - 可选项/格式
  - 单位
  - 必填
  - 填写示例
  - 来源
  - 备注
  - 机器约束
  sections:
  - title: §1 基本信息（这次实验是谁、什么时候、在什么环境做的）
    fields:
    - module: 基本信息
      label: 实验时间
      label_en: Experiment start time
      key: started_at
      meaning: 实验开始的日期与具体时刻；整条记录及所有时序数据的时间基准(t0)
      input: 日期时间
      options: —
      unit: —
      requirement:
        raw: 必填
        level: required
      example: '2026-06-20T09:30:00+08:00'
      source: 会议
      note: 时刻不能只到天
      r0: true
    - module: 基本信息
      label: 合成方法
      label_en: Synthesis method
      key: synthesis_method
      meaning: 本系统当前记录的顶层制备方法；压力、等离子体、金属有机源和盐辅助均由对应实验事实单独表达
      input: 固定定义
      options: CVD/APCVD/LPCVD/PECVD/MOCVD/盐辅助CVD/PVD-磁控溅射/PVD-热蒸发/PLD
      unit: —
      requirement:
        raw: 必填
        level: required
      example: CVD
      source: 2026-07-27终版整改
      note: 新记录固定为CVD；历史APCVD/LPCVD/PECVD/MOCVD/盐辅助CVD值继续兼容读取
      r0: true
    - module: 基本信息
      label: 实验人
      label_en: Operator
      key: operator
      meaning: 创建本条制备记录的当前登录用户
      input: 文本
      options: —
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 李俊杰
      source: 会议·产品决策2026-07-22
      note: 由系统根据当前登录账号自动填入，不可修改
      help: 由当前登录账号自动填入，不可修改
      help_en: Automatically filled from the signed-in account and cannot be changed
      r0: true
    - module: 基本信息
      label: 制备记录编号
      label_en: Preparation record code
      key: run_code
      placeholder: CVD-YYYY-NNNN
      placeholder_en: CVD-YYYY-NNNN
      help: 由系统按年度顺序自动生成，用户不可修改。
      help_en: Automatically generated by the system in annual sequence and cannot be edited.
      meaning: 本条记录的唯一编号
      input: 系统生成
      options: CVD-YYYY-NNNN
      unit: —
      requirement:
        raw: 必填
        level: required
      example: CVD-2026-0003
      source: 产品决策2026-07-22
      note: 新建制备记录时由服务端生成并校验唯一性
      r0: true
    - module: 基本信息
      label: 环境温度
      label_en: Ambient temperature
      key: ambient_temperature_C
      meaning: 实验间环境温度
      input: 数值
      options: —
      unit: ℃
      requirement:
        raw: 必填
        level: required
      example: '25'
      source: 2026-07-24导师走查
      note: 每条制备记录重新录入，不沿用上次值
      r0: true
    - module: 基本信息
      label: 环境湿度
      label_en: Ambient relative humidity
      key: ambient_humidity_percent
      meaning: 实验间相对湿度（影响生长时较重要）
      input: 数值
      options: —
      unit: '%RH'
      validation:
        ge: 0
        le: 100
      requirement:
        raw: 必填
        level: required
      example: '45'
      source: 2026-07-24导师走查
      note: 每条制备记录重新录入，不沿用上次值
      r0: true
    - module: 基本信息
      label: 实验前检查确认
      label_en: Pre-run check confirmed
      key: precheck_confirmed
      meaning: 确认开始实验前已检查气路、水路与装置状态
      input: 复选确认
      options: 已完成实验前检查
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 已勾选
      source: 2026-07-24导师走查
      note: 保存明确布尔值；只有 true 才通过锁定门
      r0: true
  - title: §1b 目标产物（你想做出什么——按你关心的维度选填，不强制全填，每项可选『其他』）
    fields:
    - module: 目标产物
      label: 目标材料化学式
      label_en: Target material formula
      key: chemical_formula
      placeholder: 例如 MoS2
      placeholder_en: e.g. MoS2
      meaning: 本征、掺杂和合金体系的目标化学式；异质结构由材料层或区域自动生成显示式
      input: 文本
      options: 标准写法（渲染规则）
      unit: —
      requirement:
        raw: 必填
        level: required
      example: MoS2
      source: 2026-07-24导师走查
      note: ★R0；复合体系权威在『组成明细』；系统静默归一化粘贴的下标数字；允许常见圆括号、组成分组与结晶水点号
      help: 选择结构类型后显示对应示例；垂直或横向异质结构由下方材料层或区域自动生成。
      help_en: The example follows the selected structure type. Vertical and lateral heterostructure formulas are generated from the material layers or regions below.
      r0: true
    - module: 目标产物
      label: 结构类型
      label_en: Structure type
      key: structure_type
      meaning: 材料结构类别（是否掺杂/合金/异质结，供机器检索）
      input: 下拉
      options: 本征/掺杂/合金/垂直异质结/横向异质结/其他
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 本征
      source: 复审
      note: 判别器；决定组成明细是否必填
      help: 选择后页面会显示该类型的化学式和组成明细填写规则
      help_en: The page shows formula and composition rules for the selected type
      r0: true
    - module: 目标产物
      label: 组成明细
      label_en: Composition details
      key: components
      ui:
        visibility_gated: true
      meaning: 按结构类型记录掺杂元素、合金混合位点，或异质结构的材料层与区域；掺杂主体直接取上方主体材料化学式
      input: 数组items[]
      options: 掺杂=掺杂元素+名义含量；合金=混合占位元素+占位比例；垂直异质结=材料层+层序+体相空间群；横向异质结=材料区域+体相空间群；其他=组成材料+适用属性；机器角色(主体材料·掺杂剂·合金组分·材料层·上层·下层·横向域)
      unit: —
      requirement:
        raw: 条件必填(结构类型≠本征)
        level: conditional_required
        condition:
          field: 目标产物.结构类型
          op: ne
          value: 本征
      example: '{MoS2,材料层,层序1,空间群194};{WS2,材料层,层序2,空间群194}'
      source: 复审·2026-07-27终版整改
      note: 掺杂界面只填一个或多个掺杂元素，保存时由主体材料化学式自动加入主体记录；合金组分只表示混合占位元素及比例；垂直结构按从衬底向上顺序记录材料层，横向结构逐区域记录；上层/下层只用于历史兼容
      r0: true
    - module: 目标产物
      label: 目标原子层数
      label_en: Target atomic-layer count
