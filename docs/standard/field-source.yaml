      label_en: Target bulk space group
      key: bulk_space_group
      meaning: 非异质结构目标材料的晶体对称性：International Tables 空间群号（1–230）；异质结构改在每层或区域填写
      ui:
        visibility_gated: true
      input: 数值
      options: —
      unit: —
      requirement:
        raw: 推荐
        level: recommended
      example: '194'
      source: 复审
      note: 本征、掺杂、合金和其他结构推荐填写；垂直或横向异质结构在组成明细逐层或逐区域填写；常见体相候选仅作快速录入，不自动判定物相
      placeholder: 搜索编号或符号，例如 194 或 P6₃/mmc
      placeholder_en: Search by number or symbol, e.g. 194 or P6₃/mmc
      help: 输入化学式后，先从常见物相中选择；没有合适候选时，可搜索全部空间群编号或符号。
      help_en: After entering the formula, choose a common phase first. If none fits, search all space-group numbers or symbols.
