experiment_record:
  headers:
  - 模块
  - 字段
  - 含义/为什么记
  - 填写方式
  - 可选项/格式
  - 单位
  - 必填
  - 填写示例
  - 来源
  - 备注
  sections:
  - title: §1 基本信息（这次实验是谁、什么时候、在什么环境做的）
    fields:
    - module: 基本信息
      label: 实验时间
      label_en: Experiment start time
      key: started_at
      meaning: 实验开始的日期与具体时刻；整条记录及所有时序数据的时间基准(t0)
      input: 日期时间
      options: —
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 2026-06-20 09:30
      source: 会议
      note: 时刻不能只到天
      r0: true
    - module: 基本信息
      label: 合成方法
      label_en: Synthesis method
      key: synthesis_method
      meaning: 本次用的气相沉积方法；顶层选择器，决定是否启用§8 PVD模块
      input: 下拉+其他
      options: CVD/APCVD/LPCVD/PECVD/MOCVD/盐辅助CVD/PVD-磁控溅射/PVD-热蒸发/PLD/其他
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 常压CVD(APCVD)
      source: v3新增
      note: ★v3新增；可挂CHMO本体ID
      r0: true
    - module: 基本信息
      label: 实验人
      label_en: Operator
      key: operator
      meaning: 创建炉次的当前登录用户
      input: 文本
      options: —
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 李俊杰
      source: 会议·产品决策2026-07-22
      note: 由系统根据当前登录账号自动填入，不可修改
      help: 由当前登录账号自动填入，不可修改
      help_en: Automatically filled from the signed-in account and cannot be changed
      r0: true
    - module: 基本信息
      label: 炉次编号
      label_en: Run code
      key: run_code
      placeholder: CVD-YYYY-NNNN
      placeholder_en: CVD-YYYY-NNNN
      help: 可按建议格式填写，并确保组内唯一。
      help_en: Use the suggested format and keep the code unique within the group.
      meaning: 本条记录的唯一编号
      input: 文本
      options: 建议含日期
      unit: —
      requirement:
        raw: 必填
        level: required
      example: CVD-2026-0003
      source: 建议
      note: ''
      r0: true
    - module: 基本信息
      label: 环境温度
      label_en: Ambient temperature
      key: ambient_temperature_C
      meaning: 实验间环境温度
      input: 数值
      options: —
      unit: ℃
      requirement:
        raw: 选填
        level: optional
      example: '25'
      source: 会议
      note: ''
    - module: 基本信息
      label: 环境湿度
      label_en: Ambient relative humidity
      key: ambient_humidity_percent
      meaning: 实验间相对湿度（影响生长时较重要）
      input: 数值
      options: —
      unit: '%RH'
      requirement:
        raw: 推荐
        level: recommended
      example: '45'
      source: 会议
      note: ★v3：选填→推荐（湿度隐变量）
    - module: 基本信息
      label: 悬浮粒子浓度
      label_en: Airborne particle concentration
      key: particle_count_per_m3
      meaning: 环境洁净度，用粒子数替代主观『干净』
      input: 数值
      options: —
      unit: 个/m³
      requirement:
        raw: 选填
        level: optional
      example: —
      source: 会议
      note: 暂无设备，先占位
    - module: 基本信息
      label: 实验前预检查
      label_en: Pre-run checklist reminder
      key: precheck_reminder
      meaning: 开始前的检查提醒（漏率/气路/水路）
      input: 提示
      options: —
      unit: —
      requirement:
        raw: —
        level: none
      example: （勾选确认）
      source: 会议
      note: 只是提醒，不存数据
  - title: §1b 目标产物（你想做出什么——按你关心的维度选填，不强制全填，每项可选『其他』）
    fields:
    - module: 目标产物
      label: 目标材料化学式
      label_en: Target material formula
      key: chemical_formula
      placeholder: 例如 MoS2
      placeholder_en: e.g. MoS2
      meaning: 规范显示串；复合体系须与组成明细一致、以组成明细为准（可自动生成）
      input: 文本
      options: 标准写法（渲染规则）
      unit: —
      requirement:
        raw: 必填
        level: required
      example: MoS2
      source: 会议
      note: ★R0；复合体系权威在『组成明细』；录入使用普通数字
      help: 直接使用普通数字，无需输入下标。选择结构类型后，按页面显示的对应规则填写。
      help_en: Use regular digits; subscripts are not required. Select a structure type and follow the corresponding rule shown on the page.
      r0: true
    - module: 目标产物
      label: 结构类型
      label_en: Structure type
      key: structure_type
      meaning: 材料结构类别（是否掺杂/合金/异质结，供机器检索）
      input: 下拉+多选
      options: 本征/掺杂/合金/垂直异质结/横向异质结/其他
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 本征
      source: 复审
      note: 判别器；决定组成明细是否必填
      help: 选择后页面会显示该类型的化学式和组成明细填写规则
      help_en: The page shows formula and composition rules for the selected type
    - module: 目标产物
      label: 组成明细
      label_en: Composition details
      key: components
      ui:
        visibility_gated: true
      meaning: 逐组分结构化（复合体系的权威数据源）
      input: 数组items[]
      options: 每条:化学式/角色(基体·掺杂剂·合金组分·上层·下层·横向域)/浓度(at%)/层序(整数)
      unit: —
      requirement:
        raw: 条件必填(结构类型≠本征)
        level: conditional_required
        condition:
          field: 目标产物.结构类型
          op: ne
          value: 本征
      example: '{WS2,上层,层序2};{MoS2,下层,层序1}'
      source: 复审
      note: ★v3.2b升为权威源+条件必填；数量拆浓度/层序；杜绝退回字符串（复审N2）
    - module: 目标产物
      label: 目标层数
      label_en: Target layer count
      key: target_layer_count
      meaning: 期望层数
      input: 数值
      options: —
      unit: 层
      requirement:
        raw: 推荐
        level: recommended
      example: 1（单层）
      source: 会议
      note: 目标与实测分开
    - module: 目标产物
      label: 体相空间群
      label_en: Bulk space group
      key: bulk_space_group
      meaning: 晶体对称性：International Tables 空间群号（1–230）
      input: 数值
      options: —
      unit: —
      requirement:
        raw: 选填
        level: optional
      example: '194'
      source: 复审
      note: ★v3：从『层群/点群/多型』改回体相空间群；手性/扭转角/堆垛→备注
      placeholder: 例如 194
      placeholder_en: e.g. 194
      help: 填写 International Tables 空间群号（1–230）；界面自动显示 Hermann–Mauguin 符号，不清楚可留空
      help_en: Enter the International Tables number (1–230); the Hermann–Mauguin symbol is displayed automatically. Leave blank if unknown
    - module: 目标产物
      label: 样品形态
      label_en: Target morphology
      key: target_morphology
      meaning: 目标形态
      input: 下拉+其他
      options: 连续膜/纳米片(flake)/纳米带/纳米管/纳米棒/纳米颗粒/其他
      unit: —
      requirement:
        raw: 推荐
        level: recommended
      example: 单层连续膜
      source: 会议
      note: ''
    - module: 目标产物
      label: 目标性能
      label_en: Target performance
      key: target_performance
      meaning: 应用导向的目标性能（写清想要什么性能 + 打算用什么方法/判据衡量）
      input: 自由+数值
      options: 示例：光学属性-高荧光量子效率 / 电属性-高迁移率
      unit: —
      requirement:
        raw: 选填
        level: optional
      example: 高迁移率（拟FET场效应测）
      source: 会议/导师
