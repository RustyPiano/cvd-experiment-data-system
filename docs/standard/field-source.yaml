# CVD-2D 元数据标准 v2.0 —— 字段【单一权威源】(实现方案 D1)
# 改字段只改这里；生成: uv run --project backend python docs/standard/build_field_tables.py
# 校验: uv run --project backend python docs/standard/check_field_source.py（CI 强制）
