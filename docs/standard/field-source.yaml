entities:
  headers:
  - 实体
  - 字段
  - 含义/为什么记
  - 填写方式
  - 可选项/格式
  - 单位
  - 必填(登记)
  - 填写示例
  - 来源
  - 备注
  - 机器约束
  sections:
  - title: ※ 本表定义『实验只引用、不重复录入』的一等实体；『必填(登记)』指登记该实体时必填，与实验记录的 R0 不同。实验引用时对当时版本快照冻结。
    fields: []
  - title: 实体① 物料批次库 MaterialLot（统一维护前驱体、衬底与气瓶批次；实验中只引用批次，纯度和粒径自动带出并锁版）
    fields:
    - module: MaterialLot
      label: 批次类别
      label_en: Lot category
      key: lot_category
      meaning: 决定启用哪组子类字段
      input: 下拉
      options: 化学品/衬底/气瓶
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 化学品
      source: 复审
      note: 驱动子类条件字段
    - module: MaterialLot
      label: 版本号
      label_en: Version number
      key: version
      meaning: 每次修改+1；实验引用时冻结此版本
      input: 数值
      options: —
      unit: —
      requirement:
        raw: 必填
        level: required
      example: '1'
      source: ★锁版使能(Fable三轮B2)
      note: 改则新版本，旧引用不受影响
    - module: MaterialLot
      label: 物质名称（中文）
      label_en: Substance name
      key: substance_name
      meaning: 物料标签或CoA上的中文名称；与化学式、CAS号分别记录
      input: 文本
      options: —
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 三氧化钼
      source: review§4.1A
      note: 不用化学式代替名称；英文标签可按课题组常用中文名填写
      help: 填物料标签或CoA对应的中文名称，例如“三氧化钼”；化学式和CAS号填在后两项。
      help_en: Enter the Chinese substance name used by the group; record the formula and CAS number in the next fields.
    - module: MaterialLot
      label: 化学式
      label_en: Chemical formula
      key: chemical_formula
      meaning: 化学身份：分子式
      input: 物料化学式
      options: 支持括号、化学计量数与水合点
      unit: —
      requirement:
        raw: 必填
        level: required
      example: MoO₃
      source: review
      note: ''
    - module: MaterialLot
      label: CAS号
      label_en: CAS number
      key: cas_number
      meaning: 唯一化学标识
      input: 文本
      options: CAS
      unit: —
      requirement:
        raw: 条件必填(化学品或气瓶)
        level: conditional_required
        condition:
          field: MaterialLot.批次类别
          op: in
          value:
          - 化学品
          - 气瓶
      example: 1313-27-5
      source: review
      note: ''
    - module: MaterialLot
      label: 供应商
      label_en: Supplier
      key: supplier
      meaning: 商业批次：厂商
      input: 下拉+其他(可扩展)
      options: 受控+其他
      unit: —
      requirement:
        raw: 推荐
        level: recommended
      example: 阿拉丁
      source: review
      note: ''
    - module: MaterialLot
      label: 供应商货号
      label_en: Supplier catalog number
      key: catalog_number
      meaning: 商业批次：产品号
      input: 文本
      options: —
      unit: —
      requirement:
        raw: 选填
        level: optional
      example: M112056
      source: review
      note: 供应商产品规格编号，标签上常写作 Cat. No.；同一货号可有多个生产批号
      help: 供应商用于标识产品和规格的编号，标签上常写作 Cat. No.；它不是生产批号。
      help_en: The supplier product/specification code, often labeled Cat. No.; it is not the production batch number.
    - module: MaterialLot
      label: 生产批号
      label_en: Production batch number
      key: batch_number
      meaning: 商业批次：生产批号（同名不同批的区分键）
      input: 文本
      options: —
      unit: —
      requirement:
        raw: 必填
        level: required
      example: B202405
      source: review
      note: GMP法定术语『批号』；标签上常写作 Lot No. 或 Batch No.
      help: 用于区分同一供应商货号下的不同生产批次，标签上常写作 Lot No. 或 Batch No.。
      help_en: Distinguishes production batches under the same catalog number; often labeled Lot No. or Batch No.
    - module: MaterialLot
      label: 纯度
      label_en: Purity
      key: purity
      meaning: 仅存质量百分数；N值由质量百分数派生显示，不作为独立存储值
      input: 数值
      options: 质量百分数（N值仅派生显示）
      unit: '%'
      validation:
        gt: 0
        le: 100
      requirement:
        raw: 条件必填(化学品或气瓶)
        level: conditional_required
        condition:
          field: MaterialLot.批次类别
          op: in
          value:
          - 化学品
          - 气瓶
      example: 99.995（派生显示4N5）
      source: review
      note: 原始证书中的N值或其他纯度表述保留在CoA/附件说明中
    - module: MaterialLot
      label: 形态与性状
      label_en: Form and appearance
      key: form_appearance
      meaning: 试剂外观
      input: 下拉+其他
      options: 粉末/颗粒/块/箔/靶/其他
      unit: —
      requirement:
        raw: 选填
        level: optional
        condition:
          field: MaterialLot.批次类别
          op: ne
          value: 气瓶
      example: 粉末
      source: review
      note: 外观=性状；气瓶不使用粉末/箔/靶等物料形态
