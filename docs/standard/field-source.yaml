      source: 复审/导师
      note: ★v3.4导师评审(B76红字)：增记堆垛类型（可判粒度待与俊杰确认，或改下拉）；最小结构化结果
      status: pending-alignment
      pending: 待明确清单#7：堆垛可判粒度→定自由文本还是下拉
    - module: 实测产物
      label: 实测层数
