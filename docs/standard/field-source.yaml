stage_types:
  note: §5 动态表单的权威映射：仅保留预处理、反应条件和具名其他记录。Pydantic 判别联合与前端显隐均从这里生成，未知阶段必须拒绝，禁止静默丢弃。
  groups:
    common: 所有记录共用（记录类型）
    preparation: 预处理操作（抽气、气路置换）
    reaction: 反应条件（温度、实测温度、逐气体供气、压力、时长、降温）
    external_field: 装置具备对应能力时才显示的本炉实际外场
    other: 具名其他记录
  types:
  - name: 预处理
    shows:
    - preparation
    required_extra:
    - preparation_operations
  - name: 反应条件
    shows:
    - reaction
    - external_field
    required_extra:
    - temperature_program
    - gas_feeds
    - pressure_system
    - duration_cycles
  - name: 其他记录
    shows:
    - other
    required_extra:
    - other_stage_name
    - notes
experiment_record:
  headers:
  - 模块
  - 字段
  - 含义/为什么记
  - 填写方式
  - 可选项/格式
  - 单位
  - 必填
  - 填写示例
  - 来源
  - 备注
  - 机器约束
  sections:
  - title: §1 基本信息（这次实验是谁、什么时候、在什么环境做的）
    fields:
    - module: 基本信息
      label: 实验时间
      label_en: Experiment start time
      key: started_at
      meaning: 实验开始的日期与具体时刻；整条记录及所有时序数据的时间基准(t0)
      input: 日期时间
      options: —
      unit: —
      requirement:
        raw: 必填
        level: required
      example: '2026-06-20T09:30:00+08:00'
      source: 会议
      note: 时刻不能只到天
      r0: true
    - module: 基本信息
      label: 合成方法
      label_en: Synthesis method
      key: synthesis_method
      meaning: 本次用的气相沉积方法；顶层选择器，决定是否启用§8 PVD模块
      input: 下拉+其他
      options: CVD/APCVD/LPCVD/PECVD/MOCVD/盐辅助CVD/PVD-磁控溅射/PVD-热蒸发/PLD/其他
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 常压CVD(APCVD)
      source: v3新增
      note: ★v3新增；可挂CHMO本体ID
      r0: true
    - module: 基本信息
      label: 实验人
      label_en: Operator
      key: operator
      meaning: 创建本条制备记录的当前登录用户
      input: 文本
      options: —
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 李俊杰
      source: 会议·产品决策2026-07-22
      note: 由系统根据当前登录账号自动填入，不可修改
      help: 由当前登录账号自动填入，不可修改
      help_en: Automatically filled from the signed-in account and cannot be changed
      r0: true
    - module: 基本信息
      label: 制备记录编号
      label_en: Preparation record code
      key: run_code
      placeholder: CVD-YYYY-NNNN
      placeholder_en: CVD-YYYY-NNNN
      help: 由系统按年度顺序自动生成，用户不可修改。
      help_en: Automatically generated by the system in annual sequence and cannot be edited.
      meaning: 本条记录的唯一编号
      input: 系统生成
      options: CVD-YYYY-NNNN
      unit: —
      requirement:
        raw: 必填
        level: required
      example: CVD-2026-0003
      source: 产品决策2026-07-22
      note: 新建制备记录时由服务端生成并校验唯一性
      r0: true
    - module: 基本信息
      label: 环境温度
      label_en: Ambient temperature
      key: ambient_temperature_C
      meaning: 实验间环境温度
      input: 数值
      options: —
      unit: ℃
      requirement:
        raw: 必填
        level: required
      example: '25'
      source: 2026-07-24导师走查
      note: 每条制备记录重新录入，不沿用上次值
      r0: true
    - module: 基本信息
      label: 环境湿度
      label_en: Ambient relative humidity
      key: ambient_humidity_percent
      meaning: 实验间相对湿度（影响生长时较重要）
      input: 数值
      options: —
      unit: '%RH'
      validation:
        ge: 0
        le: 100
      requirement:
        raw: 必填
        level: required
      example: '45'
      source: 2026-07-24导师走查
      note: 每条制备记录重新录入，不沿用上次值
      r0: true
    - module: 基本信息
      label: 实验前检查确认
      label_en: Pre-run check confirmed
      key: precheck_confirmed
      meaning: 确认开始实验前已检查气路、水路与装置状态
      input: 复选确认
      options: 已完成实验前检查
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 已勾选
      source: 2026-07-24导师走查
      note: 保存明确布尔值；只有 true 才通过锁定门
      r0: true
  - title: §1b 目标产物（你想做出什么——按你关心的维度选填，不强制全填，每项可选『其他』）
    fields:
    - module: 目标产物
      label: 目标材料化学式
      label_en: Target material formula
      key: chemical_formula
      placeholder: 例如 MoS2
      placeholder_en: e.g. MoS2
      meaning: 规范显示串；复合体系须与组成明细一致、以组成明细为准（可自动生成）
      input: 文本
      options: 标准写法（渲染规则）
      unit: —
      requirement:
        raw: 必填
        level: required
      example: MoS2
      source: 2026-07-24导师走查
      note: ★R0；复合体系权威在『组成明细』；录入使用普通数字；允许常见圆括号、组成分组与结晶水点号
      help: 直接使用普通数字，无需输入下标；允许常见圆括号与结晶水点号（·）。选择结构类型后，按页面显示的对应规则填写，复合体系仍以组成明细为准。
      help_en: Use regular digits; subscripts are not required. Common parentheses and the hydrate dot (·) are allowed. Follow the selected structure rule; components remain authoritative for composite systems.
      r0: true
    - module: 目标产物
      label: 结构类型
      label_en: Structure type
      key: structure_type
      meaning: 材料结构类别（是否掺杂/合金/异质结，供机器检索）
      input: 下拉
      options: 本征/掺杂/合金/垂直异质结/横向异质结/其他
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 本征
      source: 复审
      note: 判别器；决定组成明细是否必填
      help: 选择后页面会显示该类型的化学式和组成明细填写规则
      help_en: The page shows formula and composition rules for the selected type
      r0: true
    - module: 目标产物
      label: 组成明细
      label_en: Composition details
      key: components
      ui:
        visibility_gated: true
      meaning: 逐组分结构化（复合体系的权威数据源）
      input: 数组items[]
      options: 每条:化学式/角色(主体材料·掺杂剂·合金组分·上层·下层·横向域)/浓度(at%)/层序(整数)
      unit: —
      requirement:
        raw: 条件必填(结构类型≠本征)
        level: conditional_required
        condition:
          field: 目标产物.结构类型
          op: ne
          value: 本征
      example: '{WS2,上层,层序2};{MoS2,下层,层序1}'
      source: 复审
      note: ★v3.2b升为权威源+条件必填；数量拆浓度/层序；掺杂浓度已知时须0<at%<100，允许一个或多个掺杂剂，不强制“掺杂剂:主体材料”字符串；垂直结构下层层序须早于上层；杜绝退回字符串（复审N2）
      r0: true
    - module: 目标产物
      label: 目标层数
      label_en: Target layer count
      key: target_layer_count
      meaning: 期望层数
      input: 数值
      options: —
      unit: 层
      validation:
        type: integer
        ge: 1
      requirement:
        raw: 推荐
        level: recommended
      example: 1（单层）
      source: 会议
      note: 目标与实测分开
    - module: 目标产物
      label: 体相空间群
      label_en: Bulk space group
      key: bulk_space_group
      meaning: 晶体对称性：International Tables 空间群号（1–230）
      input: 数值
      options: —
      unit: —
      requirement:
        raw: 选填
        level: optional
      example: '194'
      source: 复审
      note: ★v3：从『层群/点群/多型』改回体相空间群；手性/扭转角/堆垛→备注
      placeholder: 例如 194
      placeholder_en: e.g. 194
      help: 填写 International Tables 空间群号（1–230）；界面自动显示 Hermann–Mauguin 符号，不清楚可留空
      help_en: Enter the International Tables number (1–230); the Hermann–Mauguin symbol is displayed automatically. Leave blank if unknown
    - module: 目标产物
      label: 样品形态
      label_en: Target morphology
      key: target_morphology
      meaning: 目标形态
      input: 下拉+其他
