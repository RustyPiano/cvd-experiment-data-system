      help: 选择物料批次后自动带出；如需修改，请在“基础资料维护”中追加物料版本。
      help_en: Filled from the selected frozen lot snapshot; create a new lot version in Reference data maintenance to change it.
    - module: 前驱体
      label: 相态
      label_en: Phase state
      key: phase_state
      meaning: 前驱体物态（决定用量单位、是否有投料mg）
      input: 下拉
      options: 固/气/液
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 固
      source: 复审
      note: ★v3.2b补：为『用量条件必填(固态源)』提供机器判别位（复审N1）
    - module: 前驱体
      label: 外观描述
      label_en: Appearance at time of use
      key: appearance
      ui:
        visibility_gated: true
      meaning: 使用时外观/性状——溯源时判断是否潮解、变质（湿度隐变量的可观察代理）
      input: 下拉+其他
      options: 白色粉末/白色晶粒/淡黄色粉末/结块或潮解/变色/其他
      unit: —
      requirement:
        raw: 推荐(固态源)
        level: conditional_recommended
        condition:
          field: 前驱体.相态
          op: eq
          value: 固
      example: 白色粉末
      source: 导师
      note: ★v3.4导师评审新增(K35)；记『使用时』状态（随时间变化），故放每炉次而非MaterialLot；词表待与俊杰确认
      status: pending-alignment
      pending: 待明确清单#8：外观描述词表待确认
    - module: 前驱体
      label: 物料批次（引用）
      label_en: Material lot (reference)
      key: lot_ref
      meaning: 引用批号（纯度/粒径自动带出），锁定当时版本
      input: 实体版本引用
      options: '{entity_id, version, snapshot}'
      unit: —
      requirement:
        raw: 必填
        level: required
      example: MoO₃-B202（锁 v1）
      source: 2026-07-24导师走查
      note: 必须引用正确类别的物料批次并冻结版本，纯度、CAS和标签证据从快照带出
      r0: true
    - module: 前驱体
      label: 角色
      label_en: Role
      key: role
      meaning: 在反应里的角色
      input: 下拉
      options: 主源/辅助剂/掺杂源/其他
      unit: —
      requirement:
        raw: 必填
        level: required
      example: 主源
      source: 建议
      note: 界面中文(英文)
    - module: 前驱体
      label: 用量
      label_en: Amount loaded
      key: amount
      meaning: 投料量（只记投料，不记残余）
      input: 数值
      ui:
        visibility_gated: true
      options: —
      unit: mg 或 µL（按相态）
      validation:
        gt: 0
      requirement:
        raw: 条件必填(非气态)
        level: conditional_required
        condition:
          field: 前驱体.相态
          op: ne
          value: 气
      example: '20'
      source: 会议/复审
      note: ★相态≠气时必填；固态mg、液态µL/质量（Fable三轮B3）
      r0: true
    - module: 前驱体
      label: 处理方式
      label_en: Pre-loading treatment
      key: treatment_steps
      meaning: 投料前处理（可多步，选了再展开参数）
      input: 前驱体处理步骤数组
      options: '{type: 直接加载|熔融凝固|压片|旋涂|退火|研磨|其他, other_name?, parameters: 具名参数对象}'
      unit: —
      requirement:
        raw: 推荐
        level: recommended
      example: '[{type: 旋涂, parameters: {speed_rpm: 3000, duration_s: 60}}]'
      source: 2026-07-24导师走查
      note: 有序可重复；已知方式使用具名参数和固定单位；压片及其他使用至少一项{name,value,unit}，不接受无单位自由文本
    - module: 前驱体
      label: 舟或坩埚
      label_en: Boat or crucible
      key: boat_crucible
      ui:
        visibility_gated: true
      meaning: 本前驱体所用盛装容器的材质、尺寸和使用履历
      input: 具名尺寸对象
      options: '{material: 石英舟|陶瓷(刚玉)舟|其他, material_other?, length_mm?, width_mm?, height_mm?, diameter_mm?, reset_count, use_number_since_reset}'
      unit: mm
      requirement:
        raw: 条件必填(非气态)
        level: conditional_required
        condition:
          field: 前驱体.相态
          op: ne
          value: 气
      example: 石英舟 90×15；重置1次；本次为重置后第7次使用
      source: 复审·用户复核2026-07-24
      note: 每个前驱体分别记录，避免多只舟共用一条履历；至少填写一个具名尺寸；其他材质须具名
      help: 重置指清洗或更换容器；本次使用序号从1开始累计。
      help_en: A reset means cleaning or replacing the container; count the current use from 1 after each reset.
    - module: 前驱体
      label: 前驱体位置
      label_en: Precursor position
      key: source_zone_temperature
      meaning: 前驱体所在温区；仅在位置温度不同于温区设定程序或另有测量/估计时补充温度及依据
      input: 温区温度对象
      options: '{zone_index, temperature_C?, temperature_basis?: 实测值|估计}'
      unit: ℃
      requirement:
        raw: 推荐；填写距热电偶距离时必填
        level: recommended
      example: 温区1；位置温度620；依据=估计
      source: 会议·用户复核2026-07-24
      note: 温区按进气端编号；温度程序仍是各温区设定值的权威记录；填写距热电偶距离时必须先选择所在温区
      help: 先选所在温区。若没有独立测量或估计，位置温度可留空，不要重复抄温度程序。
      help_en: Select the zone first. Leave the local temperature blank unless it was measured or estimated separately; do not copy the zone program.
    - module: 前驱体
      label: 距热电偶距离
      label_en: Distance to thermocouple
      key: thermocouple_distance_mm
      meaning: 距所在温区热电偶的水平距离
      input: 数值
      options: —
      unit: mm
      requirement:
        raw: 推荐
        level: recommended
      example: '-20'
      source: 会议
      note: 上游为负、下游为正
      help: 以所在温区热电偶为 0 mm；沿气流方向，上游填负值，下游填正值。
      help_en: Use the thermocouple in the selected zone as 0 mm; enter upstream positions as negative and downstream positions as positive.
  - title: §4 衬底（长在什么基底上，可多片）
