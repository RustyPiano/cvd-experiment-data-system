      key: source_zone_temperature
      meaning: 放第几温区、源温（若可设/可测）
      input: 温区温度对象
      options: '{zone_index, temperature_C}'
      unit: ℃
      requirement:
        raw: 推荐
        level: recommended
      example: 温区1，设定~620
      source: 会议
      note: 按进气端编号
    - module: 前驱体
      label: 距热电偶距离
