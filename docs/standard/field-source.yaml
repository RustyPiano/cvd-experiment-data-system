stage_types:
  note: §5 动态表单的权威映射（D11）：阶段类型 → 显示哪些参数组；common 组恒显。P3 的 discriminated union 与 P4 的表单显隐都从这里生成，禁止在代码里散写。初版由标准§5语义推导，如与实际操作不符改此处即可。
  groups:
    common: 所有阶段共用（阶段类型/步序/时长）
    temperature: 温度组（设定程序/实测/测温设备）
    cooling: 降温组（仅降温段，字段级条件必填）
    gas: 气体组（组分/纯度/流量）
    pressure: 压力组（压力体系/本底压力）
    external_field: 外场组（Setup有外场才显示，字段级条件必填）
