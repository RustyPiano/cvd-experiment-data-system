  - source_module: characterization
    source_field: result
    source_path: characterization.result
    source_label: 结果
    source_payload_path: "methods[].result"
    target: {kind: table_field, table: measured_products, key: key_spectral_metrics}
    status: 已映射
    transform: result_text_to_metrics_or_attrs
    compare: false
  - source_module: characterization
    source_field: enabled
    source_path: characterization.enabled
    source_label: 启用
    source_payload_path: "methods[].enabled"
    target: {kind: discard, reason: v1 UI启用开关不是实验元数据；禁用方法不迁入表征记录，原始值留在v1归档}
    status: 丢弃
    compare: false
  - source_module: characterization
    source_field: excitation_nm
    source_path: characterization.excitation_nm
    source_label: 激发波长
    source_payload_path: "methods[].excitation_nm"
    target: {kind: table_field, table: characterization_records, key: test_conditions}
    status: 已映射
    transform: append_test_condition
    compare: false
  - source_module: characterization
    source_field: note
    source_path: characterization.note
    source_label: 备注
    source_payload_path: "methods[].note"
    target: {kind: table_field, table: characterization_records, key: attrs}
    status: 已映射
    transform: copy_to_attrs
    compare: false

  - source_module: result_summary
    source_field: summary_result
    source_path: result_summary.summary_result
    source_label: 结果摘要
    source_payload_path: summary_result
    target: {kind: table_field, table: measured_products, key: attrs}
    status: 已映射
    transform: copy_to_attrs.summary_result
    compare: false
  - source_module: result_summary
    source_field: quality_label
    source_path: result_summary.quality_label
    source_label: 质量标签
    source_payload_path: quality_label
    target:
      - kind: table_field
        table: measured_products
        key: observed_phenomena
        draft_value_map:
          failed: 无生长/其他
          partial: 不连续覆盖
          success: 其他
          unknown: 其他
      - {kind: table_field, table: measured_products, key: attrs}
    status: 待用户确认
    transform: quality_label_to_objective_observed_phenomena
    compare: false
    note: 主观成败标签被v2移除；草案仅作客观词表/attrs辅助，须用户确认
  - source_module: result_summary
    source_field: next_step
    source_path: result_summary.next_step
    source_label: 下一步计划
    source_payload_path: next_step
    target: {kind: discard, reason: 下一步计划不是本炉次可复现实验元数据；原始值留在v1归档}
    status: 丢弃
    compare: false
  - source_module: result_summary
    source_field: failure_modes
    source_path: result_summary.failure_modes
    source_label: 失败模式
    source_payload_path: failure_modes
    target:
      - kind: table_field
        table: measured_products
        key: observed_phenomena
        draft_value_map:
          no_growth: 无生长
          sparse_nucleation: 不连续覆盖
          low_coverage: 不连续覆盖
          multilayer: 厚层区域
          discontinuous: 不连续覆盖
          poor_uniformity: 不连续覆盖
          wrong_phase: 其他
          amorphous: 其他
          contamination: 可见颗粒沾污
          cracked: 衬底破损
          equipment_fault: 其他
          other: 其他
      - kind: module_payload
        module_key: process_events
        key: event_part
        path: "items[].event_part"
        draft_value_map:
          equipment_fault: 信号异常/其他
    status: 待用户确认
    transform: failure_modes_to_observed_phenomena_or_process_event
    compare: false
    note: v1 failure_modes混合客观现象与诊断判断；每条映射须人工确认后才能正式使用
  - source_module: result_summary
    source_field: failure_detail
    source_path: result_summary.failure_detail
    source_label: 失败说明
    source_payload_path: failure_detail
    target: {kind: module_payload, module_key: process_events, key: description_action, path: "items[].description_action"}
    status: 已映射
    transform: copy
    compare: false
