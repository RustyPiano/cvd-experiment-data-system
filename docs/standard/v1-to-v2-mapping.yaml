# ============================================================================
# CVD v1 -> v2 metadata migration mapping
#
# source_module/source_field/source_path:
#   v1 authority field from docs/archive/generated/cvd-2d-field-dictionary.json.
# source_payload_path:
#   Where the value lives inside the v1 module payload. "[]" means per-item.
# target:
#   Deterministic destination. Supported kinds:
#   - module_payload: v2 experiment_module_payloads payload key from field-source.yaml
#   - entity_field: v2 first-class entity version field from field-source.yaml
#   - run_field/table_field: existing SQLAlchemy model column
#   - discard: intentionally not written; reason is mandatory
#   - manual: cannot be safely migrated automatically
# status:
#   已映射 / 需人工映射 / 待用户确认 / 丢弃.
# compare:
#   true only when v1 and v2 values are expected to be byte-for-byte equal after copy.
# transform:
#   copy is direct; other values document a lossy or structural rewrite and are not
#   used by export reconciliation unless compare=true.
#   Machine semantics: ONLY transform names starting with "merge_into_" are executed
#   (nest source_field under a dict); every other transform name is descriptive and the
#   value is copied/set verbatim (see migrate_v1_to_v2._merge_or_set).
#
# ⚠️ EXECUTION SCOPE (migrate_v1_to_v2 --execute):
#   --execute ONLY materializes status=已映射 entries whose target.kind == module_payload.
#   entity_field / table_field / run_field targets are NOT written by the migrator even
#   though they count toward the report's `mapped` total — so `mapped` OVERSTATES what a
#   real run writes. Before a production --execute (P5), review these skipped entries by
#   hand and decide whether/how to migrate them (e.g. characterization.method,
#   basic_info.recipe_id, furnace_info -> Setup rebuild).
# ============================================================================
schema:
  version: 1
  source_dictionary: docs/archive/generated/cvd-2d-field-dictionary.json
  target_field_source: docs/standard/field-source.yaml
  report_categories:
    mapped: status == 已映射
    manual: status == 需人工映射
    pending_confirmation: status == 待用户确认
    dropped: status == 丢弃
    unmapped: present in v1 dictionary but absent here

